[project]
name = "booking-agent"
version = "0.1.0"
description = "Porter-style voice booking agent with a deterministic core"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m \"not llm\""
# "auto": any `async def test_*` runs as an asyncio test with no per-test
# marker needed. Chosen over strict mode because test files increasingly mix
# sync and async tests (e.g. test_extractor.py), and strict mode requires
# every async test to carry its own @pytest.mark.asyncio -- one more thing
# to forget as phase 3 adds more async code (FastAPI routes).
asyncio_mode = "auto"
filterwarnings = [
    # starlette's TestClient triggers an anyio deprecation we do not control.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "llm: tests that call the Groq API live (deselect with '-m \"not llm\"')",
]
